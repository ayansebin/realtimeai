<style>
/* Dark, cinematic take on IBM Carbon (Gray 100 / Blue 60) with Confluent navy. Stages are full-width interactive panels. Square corners, Plex type. */
:root{
  --bg:#223463; --bg-2:#2a3f75; --bg-3:#33498a; --bg-4:#4460ad;
  --panel:rgba(255,255,255,.05); --panel-2:rgba(255,255,255,.09); --panel-3:rgba(255,255,255,.14);
  --ink:#f6f7fb; --ink-2:#d2d8e2; --ink-3:#a9b4c6; --ink-4:#8490a3;
  --line:rgba(255,255,255,.14); --line-2:rgba(255,255,255,.26);
  --blue:#0f62fe; --blue-2:#4589ff; --blue-3:#78a9ff; --blue-4:#a6c8ff; --blue-5:#d0e2ff;
  --purple:#be95ff; --purple-2:#d4bbff; --teal:#08bdba; --teal-2:#3ddbd9; --green:#42be65; --green-2:#6fdc8c; --orange:#ff832b; --red:#fa4d56; --red-2:#ff8389; --yellow:#f1c21b;
  --band:rgba(120,169,255,.16); --grid:rgba(255,255,255,.08);
  --font-sans:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;
  --font-mono:'IBM Plex Mono',Menlo,Consolas,monospace;
  --nav-h:56px;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--nav-off,var(--nav-h)) + 8px)}
@media (max-width:960px){:root{--nav-off:96px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:1.0625rem;line-height:1.5;overflow-x:hidden;
  background-image:
    radial-gradient(1000px 560px at 6% -8%, rgba(255,255,255,.14), transparent 62%),
    radial-gradient(900px 600px at 98% 2%, rgba(61,219,217,.22), transparent 62%),
    radial-gradient(1000px 760px at 72% 52%, rgba(190,149,255,.17), transparent 64%),
    radial-gradient(900px 640px at 2% 86%, rgba(120,169,255,.22), transparent 62%),
    linear-gradient(180deg, var(--bg-2) 0, var(--bg) 55%, #1c2c57 100%);
  background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg-2)}
h1,h2,h3,h4{margin:0;font-weight:300;line-height:1.12;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:var(--blue-3);text-decoration:none}
a:hover{color:var(--blue-4);text-decoration:underline}
code,pre,kbd{font-family:var(--font-mono)}
:focus-visible{outline:2px solid var(--blue-2);outline-offset:2px}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.wrap{max-width:1400px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:1056px){.wrap{padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px))}}
.mono{font-family:var(--font-mono)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:.875rem;line-height:1.45}
.tiny{font-size:.75rem;line-height:1.4;color:var(--ink-3)}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:500}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(30,46,92,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:1.25rem;min-height:var(--nav-h)}
.brand{display:flex;align-items:baseline;gap:.5rem;white-space:nowrap;color:var(--ink);font-weight:600;font-size:.95rem;letter-spacing:-.01em}
.brand:hover{text-decoration:none;color:var(--ink)}
.brand .dot{display:inline-block;width:8px;height:8px;background:var(--blue-2);box-shadow:0 0 12px var(--blue-2);vertical-align:0;margin-right:.1rem}
.brand .co{font-weight:300;color:var(--ink-3)}
.nav-links{display:flex;gap:.25rem;margin-left:auto;overflow-x:auto;scrollbar-width:none;font-size:.86rem;min-width:0}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{color:var(--ink-2);white-space:nowrap;padding:.4rem .7rem;border-bottom:2px solid transparent}
.nav-links a:hover{color:var(--ink);text-decoration:none}
.nav-links a.on{color:var(--ink);border-bottom-color:var(--blue-2)}
.nav-links a b{font-weight:500;color:var(--ink-4);margin-right:.35rem;font-size:.75rem}
@media (min-width:961px) and (max-width:1400px){.brand .co{display:none}}
@media (min-width:961px) and (max-width:1100px){.nav-links a b{display:none}.nav-links a{padding:.4rem .55rem}}
.nav .btn{min-height:38px;padding-block:0;font-size:.85rem;flex:none}
@media (max-width:960px){.nav .wrap{flex-wrap:wrap;row-gap:0;padding-block:.35rem;gap:.75rem}.brand{min-width:0;overflow:hidden;text-overflow:ellipsis}.brand .co{display:none}.nav-links{order:3;width:100%;margin-left:0;padding-bottom:.15rem}.nav-links a{padding:.35rem .55rem}.nav-links a b{display:none}.nav .btn{margin-left:auto}}

/* buttons, chips, sliders */
.btn{display:inline-flex;align-items:center;justify-content:space-between;gap:1.5rem;min-height:46px;padding:.5rem 1rem;background:var(--blue);color:#fff;border:1px solid transparent;cursor:pointer;text-decoration:none;font-size:.95rem;line-height:1.2;transition:background .12s,transform .12s}
.btn:hover{background:#0353e9;color:#fff;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn svg{width:16px;height:16px;flex:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-2)}
.btn.ghost:hover{background:var(--panel-3);color:var(--ink)}
.btn.sm{min-height:36px;padding:.3rem .8rem;font-size:.85rem;gap:.75rem}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost[aria-pressed="true"]{border-color:var(--blue-2);color:#fff;background:rgba(15,98,254,.28)}
.btn-row{display:flex;flex-wrap:wrap;gap:.6rem .75rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{display:inline-flex;align-items:center;gap:.4rem;min-height:34px;padding:.25rem .8rem;border:1px solid var(--line-2);background:transparent;color:var(--ink-2);cursor:pointer;font-size:.85rem;line-height:1;transition:background .12s,color .12s,border-color .12s;white-space:nowrap}
.chip:hover{color:var(--ink);background:var(--panel-2)}
.chip[aria-pressed="true"],.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.purple[aria-pressed="true"]{background:#6929c4;border-color:#6929c4}
.chip i{display:inline-block;width:8px;height:8px;background:currentColor;opacity:.8}
.chip.sm{min-height:28px;padding:.15rem .6rem;font-size:.78rem}
.ctl{display:flex;flex-wrap:wrap;gap:.75rem 1.25rem;align-items:center}
.ctl-group{display:flex;flex-direction:column;gap:.35rem}
.ctl-group>.eyebrow{font-size:.66rem}
.range{display:flex;align-items:center;gap:.6rem;font-size:.85rem;color:var(--ink-2)}
.range output{font-family:var(--font-mono);color:var(--ink);min-width:3ch;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:150px;height:28px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line-2)}
input[type=range]::-moz-range-track{height:2px;background:var(--line-2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;background:var(--blue-2);border:2px solid var(--bg);box-shadow:0 0 0 1px var(--blue-2),0 0 12px rgba(69,137,255,.7);margin-top:-7px;border-radius:50%}
input[type=range]::-moz-range-thumb{width:14px;height:14px;background:var(--blue-2);border:2px solid var(--bg);box-shadow:0 0 0 1px var(--blue-2),0 0 12px rgba(69,137,255,.7);border-radius:50%}
.switch{display:inline-flex;align-items:center;gap:.6rem;cursor:pointer;font-size:.85rem;color:var(--ink-2);background:none;border:0;padding:.25rem 0}
.switch i{width:38px;height:20px;border:1px solid var(--line-2);position:relative;background:var(--panel-2);transition:background .15s;flex:none}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:12px;height:12px;background:var(--ink-3);transition:transform .15s,background .15s}
.switch[aria-pressed="true"] i{background:var(--blue);border-color:var(--blue)}
.switch[aria-pressed="true"] i::after{transform:translateX(18px);background:#fff}

/* chapters and stages */
.chapter{padding-block:clamp(72px,9vw,140px) 0;position:relative}
.chapter-head{display:grid;gap:.8rem;margin-bottom:clamp(32px,4.5vw,56px)}
.chapter-head .n{font-family:var(--font-mono);font-size:.8rem;color:var(--blue-3);letter-spacing:.1em}
.chapter-head h2{font-size:clamp(2rem,4.6vw,3.6rem);max-width:24ch}
.chapter-head p{color:var(--ink-2);font-size:clamp(1.05rem,1.5vw,1.3rem);font-weight:300;max-width:52ch}
.chapter-head.sub{margin-top:clamp(56px,7vw,104px);gap:.5rem}
.chapter-head.sub h2{font-size:clamp(1.6rem,3vw,2.4rem)}
.chapter-head.sub p{font-size:clamp(1rem,1.3vw,1.15rem)}
.stage{position:relative;background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);margin-bottom:clamp(28px,3.5vw,56px);overflow:hidden}
.stage::before{content:"";position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(var(--grid) 1px, transparent 1px) 0 0/100% 48px,
  linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/48px 100%;opacity:.35;mask-image:linear-gradient(180deg,rgba(0,0,0,.28),transparent 70%);-webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.28),transparent 70%)}
.stage>*{position:relative}
.stage-top{display:flex;flex-wrap:wrap;gap:1rem 2rem;align-items:flex-end;justify-content:space-between;padding:clamp(18px,2.4vw,28px) clamp(16px,2.4vw,28px) 0}
.stage-title{display:grid;gap:.35rem;max-width:40ch}
.stage-title h3{font-size:clamp(1.35rem,2.4vw,2rem);font-weight:300}
.stage-title p{color:var(--ink-2);font-size:.95rem;font-weight:300}
.stage-body{padding:clamp(14px,2vw,22px) clamp(16px,2.4vw,28px)}
.stage-foot{display:flex;flex-wrap:wrap;gap:.75rem 1.5rem;align-items:center;justify-content:space-between;padding:0 clamp(16px,2.4vw,28px) clamp(16px,2.4vw,24px);border-top:1px solid var(--line);padding-top:14px}
.readouts{display:flex;flex-wrap:wrap;gap:.5rem 1.5rem}
.readout{display:grid;gap:.1rem;min-width:90px}
.readout b{font-weight:300;font-size:1.5rem;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.readout b.red{color:var(--red-2)}
.readout b.green{color:var(--green-2)}
.readout b.blue{color:var(--blue-3)}
.readout b.purple{color:var(--purple)}
.readout span{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.canvas-wrap{position:relative;width:100%}
canvas.stage-canvas{display:block;width:100%;height:100%;touch-action:none}
.tip{position:absolute;pointer-events:none;background:rgba(0,7,20,.92);border:1px solid var(--line-2);color:var(--ink);font:12px/1.4 var(--font-mono);padding:.4rem .55rem;display:none;z-index:3;white-space:nowrap}
.sqlline{display:flex;gap:.75rem;align-items:center;min-width:0;flex:1}
.sqlline code{font-size:.8rem;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.sqlline code .k{color:var(--blue-3)}.sqlline code .f{color:var(--purple)}.sqlline code .s{color:var(--green-2)}.sqlline code .n{color:var(--orange)}
.hint{font-size:.78rem;color:var(--ink-3);display:flex;align-items:center;gap:.4rem}
.hint::before{content:"";width:6px;height:6px;background:var(--blue-2);box-shadow:0 0 8px var(--blue-2)}

/* hero */
.hero{padding-top:clamp(48px,7vw,96px)}
.hero-head{display:grid;gap:1.1rem;margin-bottom:clamp(20px,3vw,36px)}
.pills{display:flex;flex-wrap:wrap;gap:.5rem}
.pill{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--line-2);padding:.2rem .6rem;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.pill.live{border-color:rgba(66,190,101,.6);color:var(--green-2)}
.pill.live::before{content:"";width:6px;height:6px;background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 1.6s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.h-display{font-size:clamp(2.3rem,5.6vw,4.5rem);font-weight:300;line-height:1.04;letter-spacing:-.02em;max-width:26ch}

.h-display em{font-style:normal;color:var(--blue-3)}
.lede{font-size:clamp(1.1rem,1.7vw,1.4rem);font-weight:300;color:var(--ink-2);max-width:48ch}
.hero .stage{box-shadow:0 30px 80px rgba(0,0,0,.3)}
.hero .canvas-wrap{height:clamp(300px,46vh,520px)}


/* agent pipeline */
.pipe{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:stretch}
.node{position:relative;background:rgba(255,255,255,.05);border:1px solid var(--line);padding:.9rem .9rem .8rem;min-height:150px;display:grid;align-content:start;gap:.4rem;transition:border-color .2s,box-shadow .2s,background .2s}
.node .nl{font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:.45rem}
.node .nl i{width:8px;height:8px;background:var(--ink-4);flex:none}
.node .nt{font-size:.95rem;font-weight:500;color:var(--ink)}
.node .nb{font-family:var(--font-mono);font-size:.74rem;color:var(--ink-2);line-height:1.45;white-space:pre-wrap;word-break:break-word;min-height:2.6em}
.node.lit{border-color:var(--blue-2);box-shadow:0 0 0 1px var(--blue-2),0 0 28px rgba(69,137,255,.35);background:rgba(0,29,108,.5)}
.node.lit .nl i{background:var(--blue-2);box-shadow:0 0 8px var(--blue-2)}
.node.agent.lit{border-color:var(--purple);box-shadow:0 0 0 1px var(--purple),0 0 28px rgba(190,149,255,.35);background:rgba(49,19,94,.45)}
.node.agent.lit .nl i{background:var(--purple);box-shadow:0 0 8px var(--purple)}
.node.flag .nb{color:var(--red-2)}
.node.ok .nb{color:var(--green-2)}
.pipe-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.pipe-svg path{fill:none;stroke:var(--line-2);stroke-width:1.5}
.pipe-svg .flow{stroke:var(--blue-2);stroke-dasharray:4 10;animation:dash 1.4s linear infinite;opacity:.6}
@keyframes dash{to{stroke-dashoffset:-28}}
.particle{position:absolute;width:12px;height:12px;background:var(--blue-3);box-shadow:0 0 14px var(--blue-2),0 0 30px rgba(69,137,255,.6);transform:translate(-50%,-50%);pointer-events:none;opacity:0;z-index:2}
.particle.purple{background:var(--purple);box-shadow:0 0 14px var(--purple),0 0 30px rgba(190,149,255,.6)}
.log{margin-top:14px;background:rgba(0,0,0,.3);border:1px solid var(--line);padding:.8rem 1rem;font-family:var(--font-mono);font-size:.78rem;line-height:1.55;color:var(--ink-2);min-height:7.2em;max-height:12em;overflow:auto}
.log .t{color:var(--ink-4)}.log .a{color:var(--purple)}.log .f{color:var(--blue-3)}.log .r{color:var(--red-2)}.log .g{color:var(--green-2)}.log .y{color:var(--yellow)}
.log div{white-space:pre-wrap;word-break:break-word}
@media (max-width:900px){.pipe{grid-template-columns:1fr 1fr}.node{min-height:120px}.node:last-child{grid-column:1/-1}}
@media (max-width:520px){.pipe{grid-template-columns:1fr}.node{min-height:0}}

/* models */
.models{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:980px){.models{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.models{grid-template-columns:1fr}}
.mcard{position:relative;text-align:left;background:rgba(255,255,255,.045);border:1px solid var(--line);padding:1rem 1rem .9rem;display:grid;gap:.5rem;cursor:pointer;transition:border-color .15s,background .15s,transform .15s;min-height:250px;align-content:start}
.mcard:hover{border-color:var(--line-2);background:rgba(0,29,108,.3)}
.mcard.on{border-color:var(--blue-2);box-shadow:0 0 0 1px var(--blue-2),0 0 30px rgba(69,137,255,.25);background:rgba(0,29,108,.45)}
.mcard .mk{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.mcard h4{font-size:1.3rem;font-weight:400}
.mcard .mp{font-family:var(--font-mono);font-size:.78rem;color:var(--blue-3)}
.mcard canvas{width:100%;height:64px;display:block}
.mcard .ml{font-size:.85rem;color:var(--ink-2);line-height:1.4}
.mcard .mb{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:auto}
.mcard .mb span{font-size:.68rem;border:1px solid var(--line-2);padding:.12rem .45rem;color:var(--ink-2)}
.mcard .mb span.gold{border-color:rgba(241,194,27,.6);color:var(--yellow)}
.mcard .use{position:absolute;top:.75rem;right:.75rem;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--blue-3);opacity:0;transition:opacity .15s}
.mcard.on .use{opacity:1}
.bubbles{position:relative;height:150px;border-bottom:1px solid var(--line);margin-bottom:12px}
.bubbles .b{position:absolute;bottom:0;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(166,200,255,.9),rgba(15,98,254,.55) 55%,rgba(15,98,254,.15));box-shadow:0 0 30px rgba(69,137,255,.35);transform:translateX(-50%) scale(0);transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.bubbles.in .b{transform:translateX(-50%) scale(1)}
.bubbles .bl{position:absolute;bottom:0;transform:translateX(-50%);font-family:var(--font-mono);font-size:.72rem;color:var(--ink-2);white-space:nowrap;text-align:center}
.bubbles .bl b{display:block;font-weight:400;color:var(--ink);font-size:.95rem}
.bench{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
@media (max-width:900px){.bench{grid-template-columns:1fr}}
.bcard{background:rgba(255,255,255,.045);border:1px solid var(--line);padding:1rem;display:grid;gap:.7rem;align-content:start}
.bcard .bh{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
.bcard .bh b{font-weight:300;font-size:2.4rem;line-height:1;color:var(--ink)}
.bcard .bh b small{font-size:1rem;color:var(--ink-3)}
.bcard .bh span{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);text-align:right}
.bars{display:grid;gap:.45rem}
.bar{display:grid;grid-template-columns:7.5rem 1fr 3.2rem;gap:.6rem;align-items:center;font-size:.78rem;color:var(--ink-2)}
.bar i{display:block;height:10px;background:var(--line);position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0;width:0;background:var(--ink-4);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.bar.hi i::after{background:linear-gradient(90deg,var(--blue),var(--blue-3));box-shadow:0 0 12px rgba(69,137,255,.6)}
.bar.gold i::after{background:linear-gradient(90deg,#8e6a00,var(--yellow))}
.in .bar i::after{width:var(--w)}
.bar em{font-style:normal;font-family:var(--font-mono);text-align:right;color:var(--ink)}
.bcard .bf{font-size:.72rem;color:var(--ink-3)}

/* dials */
.dials{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:980px){.dials{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.dials{grid-template-columns:1fr}}
.dial{background:rgba(255,255,255,.045);border:1px solid var(--line);padding:1.1rem 1rem 1rem;display:grid;grid-template-columns:minmax(0,1fr) 72px;gap:.4rem .6rem;align-items:center;position:relative;overflow:hidden}
.dial .dt{display:grid;gap:.35rem;min-width:0}
.dial svg{width:72px;height:72px;opacity:.95;justify-self:end}
@media (max-width:480px){.dial{grid-template-columns:minmax(0,1fr)}.dial svg{display:none}}
.dial svg circle{fill:none;stroke-width:6;stroke-linecap:butt}
.dial svg .trk{stroke:var(--line)}
.dial svg .arc{stroke:var(--blue-2);stroke-dasharray:var(--c);stroke-dashoffset:var(--c);transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1);transform:rotate(-90deg);transform-origin:50% 50%}
.in .dial svg .arc{stroke-dashoffset:var(--o)}
.dial b{font-weight:300;font-size:clamp(2.4rem,3.6vw,3.2rem);line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.dial b small{font-size:1.2rem;color:var(--blue-3)}
.dial .dk{font-size:.95rem;color:var(--ink)}
.dial .dd{font-size:.8rem;color:var(--ink-3)}

/* then / now */
.thennow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(16px,3vw,40px);align-items:start}
@media (max-width:900px){.thennow{grid-template-columns:1fr}}
.tn-toggle{display:inline-grid;grid-template-columns:1fr 1fr;border:1px solid var(--line-2);margin-bottom:1rem}
.tn-toggle button{background:transparent;border:0;padding:.55rem 1.2rem;color:var(--ink-2);cursor:pointer;font-size:.9rem}
.tn-toggle button.on{background:var(--blue);color:#fff}
.boxes{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;min-height:84px;align-content:start}
.boxes i{display:block;aspect-ratio:1;background:var(--ink-4);border:1px solid rgba(255,255,255,.08);transition:opacity .5s,transform .5s,background .5s}
.boxes.now i{opacity:0;transform:scale(.4)}
.boxes.now i.keep{opacity:1;transform:scale(1);background:var(--blue-2);box-shadow:0 0 18px rgba(69,137,255,.7)}
.tn-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:1rem}
@media (max-width:480px){.tn-stats{grid-template-columns:1fr}}
.tn-stat{background:rgba(255,255,255,.045);border:1px solid var(--line);padding:.8rem .9rem;display:grid;gap:.2rem}
.tn-stat b{font-weight:300;font-size:2rem;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.tn-stat span{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.tn-stat.good b{color:var(--green-2)}
.quad{position:relative;width:100%;aspect-ratio:1.25;max-width:520px;border:1px solid var(--line);background:rgba(0,7,20,.4)}
.quad .q{position:absolute;width:50%;height:50%;padding:.7rem .8rem;font-size:.78rem;color:var(--ink-3);border:1px solid var(--line);display:grid;align-content:start;gap:.2rem;transition:background .4s,color .4s}
.quad .q b{font-weight:500;color:var(--ink-2);font-size:.82rem}
.quad .q.on{background:rgba(15,98,254,.22);color:var(--ink-2)}
.quad .q.on b{color:var(--ink)}
.quad .q.bl{left:0;bottom:0}.quad .q.br{right:0;bottom:0}.quad .q.tl{left:0;top:0}.quad .q.tr{right:0;top:0}
.quad .axis{position:absolute;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.quad .axis.x{bottom:-1.4rem;left:0;right:0;text-align:center}
.quad .axis.y{left:-1.1rem;top:50%;transform:rotate(-90deg) translateX(-50%);transform-origin:0 0;white-space:nowrap}
.quad .dotp{position:absolute;width:18px;height:18px;border-radius:50%;background:var(--blue-3);box-shadow:0 0 18px var(--blue-2),0 0 40px rgba(69,137,255,.5);transform:translate(-50%,-50%);transition:left .9s cubic-bezier(.2,.8,.2,1),top .9s cubic-bezier(.2,.8,.2,1)}
.quad .trail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.quad .trail path{fill:none;stroke:var(--blue-2);stroke-width:2;stroke-dasharray:6 6;opacity:0;transition:opacity .4s;vector-effect:non-scaling-stroke}
.quad.now .trail path{opacity:.8}

/* proof */
.proof{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:900px){.proof{grid-template-columns:1fr}}
.pcard{background:rgba(255,255,255,.045);border:1px solid var(--line);padding:1.1rem 1rem 1rem;display:grid;gap:.6rem;align-content:start;min-height:230px}
.pcard .pk{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.pcard b{font-weight:300;font-size:clamp(2.2rem,3.6vw,3rem);line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.pcard b small{font-size:1rem;color:var(--ink-3)}
.pcard .pt{font-size:.95rem;color:var(--ink)}
.pcard .pd{font-size:.82rem;color:var(--ink-3);line-height:1.45}
.pcard canvas{width:100%;height:56px;display:block}
.pcard .tags{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:auto}
.pcard .tags span{font-size:.68rem;border:1px solid var(--line-2);padding:.12rem .45rem;color:var(--ink-2)}

/* use case tabs */
.uctabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:12px}
.uctabs button{background:transparent;border:1px solid var(--line-2);color:var(--ink-2);padding:.6rem 1rem;cursor:pointer;font-size:.9rem;display:inline-flex;align-items:center;gap:.5rem}
.uctabs button i{width:10px;height:10px;background:var(--ink-4)}
.uctabs button[aria-selected="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.uctabs button[aria-selected="true"] i{background:#fff}
@media (max-width:760px){.uctabs button{flex:1 1 calc(50% - .4rem);justify-content:flex-start;padding:.55rem .7rem;font-size:.84rem}}
.ucpanel .canvas-wrap{height:clamp(260px,40vh,420px)}
.opt-col{display:grid;grid-template-rows:1fr auto;gap:.5rem;min-width:0}
.opt-wrap{min-height:clamp(320px,44vh,480px)}
.op-cap{padding:.1rem .2rem}
.side{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px}
@media (max-width:900px){.side{grid-template-columns:1fr}}
.panel{background:rgba(255,255,255,.045);border:1px solid var(--line);padding:.9rem 1rem;display:grid;gap:.7rem;align-content:start}
.panel .ph{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.25rem .8rem;font-size:.84rem;color:var(--ink-2)}
.kv b{font-family:var(--font-mono);font-weight:400;color:var(--ink);text-align:right;min-width:0;overflow-wrap:anywhere}
.kv b.red{color:var(--red-2)}.kv b.green{color:var(--green-2)}.kv b.blue{color:var(--blue-3)}
.action{border:1px solid var(--line-2);padding:.6rem .7rem;font-size:.85rem;color:var(--ink);display:grid;gap:.2rem;background:rgba(15,98,254,.12)}
.action small{color:var(--ink-3);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase}
.action.red{background:rgba(250,77,86,.12);border-color:rgba(250,77,86,.5)}
.action.green{background:rgba(66,190,101,.12);border-color:rgba(66,190,101,.5)}
.op-table{width:100%;border-collapse:collapse;font-size:.82rem}
.op-table th{font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:500;text-align:right;padding:0 0 .3rem}
.op-table th:first-child{text-align:left}
.op-table td{padding:.3rem 0;border-top:1px solid var(--line);color:var(--ink-2)}
.op-table td+td{font-family:var(--font-mono);text-align:right;color:var(--ink)}
.op-table td:last-child{color:var(--green-2)}
.op-table td.dim{color:var(--ink-4)}
.op-steps{display:grid;gap:.3rem;font-size:.8rem;color:var(--ink-3)}
.op-steps>div{display:flex;gap:.55rem;align-items:flex-start;transition:color .2s}
.op-steps i{flex:none;width:18px;height:18px;border:1px solid var(--line-2);font-style:normal;font-size:.66rem;display:grid;place-items:center;color:var(--ink-3);font-family:var(--font-mono)}
.op-steps>div.on{color:var(--ink)}
.op-steps>div.on i{background:var(--blue);border-color:var(--blue);color:#fff}
.op-steps>div.done{color:var(--ink-2)}
.op-steps>div.done i{border-color:var(--green);color:var(--green-2)}
.tiles{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;align-content:start}
@media (max-width:900px){.tiles{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media (max-width:560px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{position:relative;aspect-ratio:1.5;background:rgba(255,255,255,.045);border:1px solid var(--line);transition:border-color .3s,box-shadow .3s,opacity .3s}
.tile canvas{width:100%;height:100%;display:block}
.tile .sc{position:absolute;right:.3rem;top:.2rem;font-family:var(--font-mono);font-size:.66rem;color:var(--ink-3)}
.tile .id{position:absolute;left:.3rem;bottom:.15rem;font-family:var(--font-mono);font-size:.6rem;color:var(--ink-4)}
.tile.hit{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal),0 0 22px rgba(8,189,186,.4)}
.tile.hit .sc{color:var(--teal-2)}
.tiles.searching .tile:not(.hit){opacity:.35}
.qbox{height:110px;cursor:crosshair;background:rgba(255,255,255,.045);border:1px solid var(--line-2);position:relative}
.qbox canvas{width:100%;height:100%;display:block;touch-action:none}
.qbox .ghost{position:absolute;inset:0;display:grid;place-items:center;font-size:.8rem;color:var(--ink-3);pointer-events:none}
.qbox.has .ghost{display:none}

/* start */
.codebox{position:relative;background:rgba(0,0,0,.3);border:1px solid var(--line)}
.codebox pre{margin:0;padding:.9rem 1rem;font-size:.78rem;line-height:1.5;overflow:auto;color:var(--ink-2)}
.codebox pre .k{color:var(--blue-3)}.codebox pre .f{color:var(--purple)}.codebox pre .s{color:var(--green-2)}.codebox pre .n{color:var(--orange)}
.codebox .copy{position:absolute;top:.5rem;right:.5rem}

/* topbar + nav stat */
.topbar{background:linear-gradient(90deg,rgba(15,98,254,.35),rgba(105,41,196,.3));border-bottom:1px solid var(--line);font-size:.8rem;color:var(--ink-2)}
.topbar .wrap{display:flex;gap:1rem;align-items:center;justify-content:center;min-height:34px;flex-wrap:wrap}
.topbar b{color:var(--ink);font-weight:500;margin-right:.35rem;border:1px solid rgba(255,255,255,.35);padding:.05rem .4rem;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase}
.topbar a{color:var(--ink);white-space:nowrap}
@media (max-width:760px){.topbar{display:none}}
.nav-stat{display:inline-flex;align-items:baseline;gap:.35rem;font-size:.8rem;color:var(--ink-2);white-space:nowrap;border:1px solid var(--line-2);padding:.3rem .6rem}
.nav-stat b{font-weight:500;color:var(--ink)}
.nav-stat:hover{text-decoration:none;color:var(--ink);background:var(--panel-2)}
@media (max-width:900px){.nav-stat{display:none}}

/* rotating word */
.h-display .rot{position:relative;white-space:nowrap}
.h-display .caret{display:inline-block;width:3px;height:.85em;background:var(--blue-3);vertical-align:-.08em;margin-left:.08em;animation:blink .9s steps(1) infinite}
.h-display .caret.c2{animation-delay:.45s;background:var(--green-2)}
.h-display em.rot2{color:var(--green-2)}

/* hero stats + marquee */
.stats{display:flex;flex-wrap:wrap;gap:.6rem 2.2rem;margin-top:.4rem}
.stat{display:grid;gap:.05rem}
.stat b{font-weight:300;font-size:1.7rem;line-height:1.05;color:var(--ink);font-variant-numeric:tabular-nums}
.stat span{font-size:.74rem;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.marquee{margin-top:14px;margin-bottom:clamp(40px,5vw,72px);border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:1.5rem;overflow:hidden;min-height:48px}
.mq-label{flex:none;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding-right:1.5rem;border-right:1px solid var(--line)}
.mq-track{flex:1;min-width:0;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.mq-inner{display:flex;gap:2.2rem;width:max-content;animation:mq 46s linear infinite;font-size:.86rem;color:var(--ink-2);white-space:nowrap}
.mq-inner span{display:inline-flex;align-items:center;gap:.5rem}
.mq-inner span::before{content:"";width:6px;height:6px;background:var(--blue-2);opacity:.8}
.marquee:hover .mq-inner{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
@media (max-width:760px){.mq-label{display:none}}
@media (prefers-reduced-motion:reduce){.mq-inner{animation:none}.h-display .caret{animation:none}}

/* architecture */
.arch{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr) minmax(0,1fr);gap:clamp(18px,4vw,64px);align-items:center}
@media (max-width:900px){.arch{grid-template-columns:1fr;gap:18px}}
.arch-cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.arch-col{position:relative;z-index:2;display:grid;gap:8px;align-content:start}
.arch-h{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);display:flex;gap:.6rem;align-items:center;margin-bottom:.2rem}
.arch-h span{font-family:var(--font-mono);color:var(--blue-3)}
.arch-node{background:rgba(0,7,20,.75);border:1px solid var(--line-2);padding:.55rem .75rem;font-size:.88rem;color:var(--ink)}
.arch-f{font-size:.74rem;color:var(--ink-3);margin-top:.3rem}
.arch-engine{background:linear-gradient(180deg,rgba(0,29,108,.55),rgba(0,13,60,.7));border:1px solid var(--blue-2);box-shadow:0 0 0 1px rgba(69,137,255,.25),0 0 50px rgba(15,98,254,.25);padding:.5rem;display:grid;gap:6px}
.arch-row{display:grid;grid-template-columns:10px 1fr;gap:.2rem .6rem;align-items:center;background:rgba(255,255,255,.05);border:1px solid var(--line);padding:.55rem .7rem}
.arch-row i{width:10px;height:10px;background:var(--blue-2);box-shadow:0 0 10px var(--blue-2);grid-row:1/3}
.arch-row b{font-weight:500;font-size:.9rem;color:var(--ink)}
.arch-row span{font-size:.74rem;color:var(--ink-3);grid-column:2;line-height:1.35}
.arch-row.purple i{background:var(--purple);box-shadow:0 0 10px var(--purple)}
.arch-row.purple{border-color:rgba(190,149,255,.4)}
.arch-col.mid .arch-f{text-align:center}
.arch-brand{display:flex;align-items:baseline;gap:.55rem;flex-wrap:wrap;padding:.15rem .1rem .25rem}
.arch-brand b{font-size:1rem;font-weight:500;color:#fff}
.arch-brand span{font-size:.74rem;color:var(--ink-3)}
.arch-brand.ibm{padding-top:.1rem}
.arch-join{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.6rem;margin:.15rem 0}
.arch-join i{height:1px;background:linear-gradient(90deg,rgba(120,169,255,0),rgba(120,169,255,.6),rgba(120,169,255,0))}
.arch-join span{font-family:var(--font-mono);font-size:1.1rem;color:var(--blue-3);line-height:1}
.arch-row.ibm i{background:var(--blue-3)}
.arch-row.ibm{border-color:rgba(120,169,255,.42)}
.arch-row{transition:background .35s,border-color .35s}
.arch-row.lit,.arch-row.tour-hi{background:rgba(15,98,254,.26);border-color:var(--blue-2)}
.arch-row.purple.lit,.arch-row.purple.tour-hi{background:rgba(190,149,255,.2);border-color:var(--purple)}
/* the demo walks the stack: Confluent, the join, Granite, the agent */
.arch-join span{display:inline-block;transition:transform .4s,color .4s}.arch-join.tour-hi span{color:#fff;transform:scale(1.6)}
.arch-brand b,.arch-col.mid .arch-f{transition:color .4s}.arch-brand.tour-hi b{color:var(--blue-4)}.arch-col.mid .arch-f.tour-hi{color:var(--blue-4)}

/* proof labels + trust */
.pcard .pk em{font-style:normal;margin-left:.4rem;border:1px solid var(--line-2);padding:.05rem .4rem;font-size:.62rem;color:var(--ink-2);letter-spacing:.06em}
.pcard .pk{display:flex;flex-wrap:wrap;align-items:center;gap:.25rem}
.trust{border:1px solid var(--line);background:var(--panel);padding:clamp(16px,2.4vw,26px) clamp(16px,2.4vw,28px);display:grid;gap:1rem}

.trust-i span{font-size:.75rem;color:var(--ink-3);line-height:1.35}

/* two ways */
.ways{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}

.way{background:rgba(255,255,255,.045);border:1px solid var(--line);padding:1.2rem 1.1rem 1.1rem;display:grid;gap:.8rem;align-content:start}
.way.on{border-color:var(--blue-2);box-shadow:0 0 0 1px rgba(69,137,255,.35),0 0 40px rgba(15,98,254,.18);background:rgba(0,29,108,.3)}
.way .wk{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.way.on .wk{color:var(--blue-3)}
.way h3{font-size:1.4rem;font-weight:300}
.way p{color:var(--ink-2);font-size:.9rem}
.way pre{margin:0;background:rgba(0,0,0,.3);border:1px solid var(--line);padding:.7rem .8rem;font-size:.76rem;line-height:1.5;overflow:auto;color:var(--ink-2)}
.way pre .k{color:var(--blue-3)}.way pre .f{color:var(--purple)}.way pre .s{color:var(--green-2)}.way pre .n{color:var(--orange)}
.cta .lede{max-width:40ch}
.foot .tag{color:var(--ink);font-weight:500}

/* photos */
.inds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
@media (max-width:1100px){.inds{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.inds{grid-template-columns:1fr}}
.ind{position:relative;display:grid;align-content:end;gap:.55rem;min-height:clamp(200px,20vw,280px);padding:1.1rem 1.1rem 1rem;border:1px solid var(--line);color:var(--ink);overflow:hidden;isolation:isolate;background:#000a2e;text-align:left;font:inherit;cursor:pointer;transition:border-color .15s}
.ind[aria-selected="true"]{border-color:var(--blue-2);box-shadow:0 0 0 1px var(--blue-2) inset,0 0 24px rgba(69,137,255,.2)}
.inds{margin-bottom:12px}
.ind .is i{font-style:normal;font-size:.7rem;border:1px solid var(--line-2);background:rgba(0,7,20,.45);color:var(--ink-2);padding:.15rem .45rem}
.ind::before{content:"";position:absolute;inset:0;background-image:var(--img);background-size:cover;background-position:center;filter:saturate(.85) contrast(1.05);transition:transform .6s cubic-bezier(.2,.8,.2,1);z-index:-2}
.ind::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,10,46,.12) 0,rgba(0,7,20,.62) 38%,rgba(0,7,20,.95) 100%);z-index:-1}
.ind:hover{border-color:var(--blue-2)}
.ind:hover::before{transform:scale(1.05)}
.ind .il{display:grid;gap:.15rem;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--blue-3)}
.ind .il small{font-size:.66rem;letter-spacing:.04em;text-transform:none;color:var(--ink-3)}
