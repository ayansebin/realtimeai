name: onnx
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma separated variant names to export (empty for all)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  onnx:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install granite-tsfm (CPU torch) and ONNX tooling
        run: |
          python -m pip install -q --upgrade pip
          pip install -q "torch>=2.10,<2.12" --index-url https://download.pytorch.org/whl/cpu
          pip install -q "git+https://github.com/ibm-granite/granite-tsfm@main" numpy onnx onnxscript "onnxruntime==1.20.1"
          python -c "import torch, onnx, onnxscript, onnxruntime, tsfm_public; print('torch', torch.__version__, 'onnx', onnx.__version__, 'onnxscript', onnxscript.__version__, 'ort', onnxruntime.__version__)"
      - name: Export
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          ONLY: ${{ github.event.inputs.only }}
        run: |
          python scripts/export_onnx.py || echo "export exited with an error, partial results are kept"
          ls -la models
          cat models/log.txt
      - name: Commit
        run: |
          git config user.name "playground-bot"
          git config user.email "ayhansebin@gmail.com"
          git add models
          git commit -m "Export TTM r3 to ONNX for the in-browser playground" || echo "nothing to commit"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 10
          done
